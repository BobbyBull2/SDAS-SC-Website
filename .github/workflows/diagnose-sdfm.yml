name: Diagnose live SDFM blank page
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-sdfm.yml'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect production responses
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,re
          for path in ["/","/SDFM/","/SDFM/index.html","/SDFM/auth-preview.js","/SDFM/fleet-design.css","/SDFM/public/images/preview-hangar.png"]:
            url="https://sdas.space"+path
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Cache-Control":"no-cache"})
              with urllib.request.urlopen(req,timeout=20) as response:
                body=response.read()
                text=body[:3000].decode("utf-8","replace")
                print("URL",url,"STATUS",response.status,"CONTENT_TYPE",response.headers.get("content-type"),"LEN",len(body),"FINAL_URL",response.url)
                print("HAS_REACT_ROOT",'<div id="root">' in text,"HAS_FLEET",("sdas-production-access" in text or "SOME DUDES" in text),"LINKS",re.findall(r'(?:src|href)=[\\"\\']([^\\"\\']+)',text)[:12])
                print("HEAD",text[:450].replace("\n"," "))
            except Exception as e:print("URL",url,"ERROR",repr(e))
          PY
