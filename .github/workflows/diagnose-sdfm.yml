name: Diagnose live SDFM blank page
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-sdfm.yml'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect production and Pages responses
        run: |
          python3 - <<'PY'
          import urllib.request
          domains=["https://sdas.space","https://sdas-sc-website.pages.dev","https://17b99fe7.sdas-sc-website.pages.dev"]
          paths=["/","/SDFM/","/SDFM/index.html","/SDFM/auth-preview.js","/SDFM/fleet-design.css","/SDFM/public/images/preview-hangar.png"]
          for domain in domains:
            for path in paths:
              url=domain+path
              try:
                req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Cache-Control":"no-cache"})
                with urllib.request.urlopen(req,timeout=15) as response:
                  body=response.read()
                  head=body[:400].decode("utf-8","replace").replace(chr(10)," ")
                  print("CHECK",url,"STATUS",response.status,"MIME",response.headers.get("content-type"),"SIZE",len(body),"HEAD",head[:120])
              except Exception as e:
                print("CHECK",url,"ERROR",repr(e))
          PY
