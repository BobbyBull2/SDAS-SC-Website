name: Deploy SDAS website to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Publish one production build at a time, always favoring the newest commit.
concurrency:
  group: sdas-pages-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Test, build, and deploy sdas.space
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out website source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build website
        run: npm run build

      - name: Stage live Fleet Manager at /SDFM/
        run: |
          python3 scripts/stage-sdfm.py
          test -s dist/index.html
          test -s dist/SDFM/index.html
          test -s dist/SDFM/auth-preview.js
          test -s dist/SDFM/fleet-design.css
          test -s dist/SDFM/public/images/preview-hangar.png
          node --check dist/SDFM/auth-preview.js
          node --check dist/SDFM/fleet-ui-polish.js
          node --check dist/SDFM/rsi-import.js
          python3 - <<'PY'
          from pathlib import Path
          home=Path("dist/index.html").read_text()
          fleet=Path("dist/SDFM/index.html").read_text()
          assert '<div id="root">' in home
          assert '/SDFM/auth-preview.js' in fleet
          assert 'sdas-production-access' in fleet
          assert 'sdas-cloud-verified' in fleet
          assert 'PREVIEW BUILD' not in fleet
          print("Production home intact and Fleet Manager safely isolated.")
          PY

      - name: Check Cloudflare credentials
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_ACCOUNT_ID" ] || [ -z "$CF_API_TOKEN" ]; then
            echo "::error::Add CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN to repository Settings > Secrets and variables > Actions before deploying."
            exit 1
          fi

      - name: Deploy to existing Cloudflare Pages project
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=sdas-sc-website --branch=main
