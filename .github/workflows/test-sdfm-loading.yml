name: SDFM fleet loading performance regression
on:
  push:
    branches: [fix/sdfm-fast-load-20261029]
  pull_request:
    branches: [main]
    paths:
      - 'fleet-preview/fleet-cloud-inline.js'
      - 'tests/sdfm-fast-load.test.mjs'
      - '.github/workflows/test-sdfm-loading.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate speed and session regressions
        run: |
          node --check fleet-preview/fleet-cloud-inline.js
          node --test tests/sdfm-fast-load.test.mjs
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build production Fleet Manager with unchanged auth
        run: |
          python3 scripts/stage-sdfm.py
          test -s dist/SDFM/index.html
          test -s dist/SDFM/auth-preview.js
          node --check dist/SDFM/auth-preview.js
          node --check dist/SDFM/sdfm-production-login.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('dist/SDFM/index.html').read_text()
          assert 'void hydrateShipPhotos(u.id,photoToken)' in s
          assert '.createSignedUrls(' in s
          assert 'validMembership(m)' in s
          assert 'client.from("fleet_ships")' in s
          assert 'client.from("preview_fleet_ships")' not in s
          assert 'sdasFleetProspectReadOnly' in s
          assert '<div id="root">' in Path('dist/index.html').read_text()
          print('Production fleet staging and homepage isolation OK')
          PY
