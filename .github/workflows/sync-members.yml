name: Refresh public SDAS crew roster
on:
  workflow_dispatch:
  schedule:
    - cron: '23 10 * * *'
permissions:
  contents: write
concurrency:
  group: public-member-sync
  cancel-in-progress: false
jobs:
  sync:
    # Opt in only after branch review and publication approval.
    if: vars.SDAS_MEMBER_SYNC_ENABLED == 'true' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run sync:members
      - name: Save successful public roster snapshot only
        run: |
          if git diff --quiet -- public/data/members.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/data/members.json
          git commit -m 'Refresh public SDAS crew roster'
          git push
