name: Fleet Terminal v2.5 Preview
on:
  push:
    branches: [preview/fleet-terminal-v2]
    paths:
      - 'fleet-preview/**'
      - '.github/workflows/preview-fleet-terminal.yml'
      - 'public/images/preview-hangar.png'
      - 'package-lock.json'
      - 'package.json'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fleet-terminal-v25-review-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true
jobs:
  live-http-probe:
    name: Read-only live SDFM HTTP check
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Probe SDFM and its JavaScript from GitHub's network
        run: |
          python3 - <<'PY'
          import urllib.request
          for url in [
            'https://sdas.space/',
            'https://sdas.space/SDFM/',
            'https://sdas.space/SDFM/auth-preview.js',
            'https://sdas.space/SDFM/sdfm-production-login.js',
            'https://sdas-sc-website.pages.dev/SDFM/',
            'https://sdas.space/SDFM/index.html',
            'https://sdas.space/SDFM/fleet-design.css',
            'https://sdas.space/sdfm/',
            'https://fb811f5d.sdas-sc-website.pages.dev/SDFM/',
            'https://fb811f5d.sdas-sc-website.pages.dev/SDFM/auth-preview.js',
            'https://sdas.space/SDFM/assets/main-uNvZzTPD.js'
          ]:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=12) as r:
                text=r.read(1000)
                print('PROBE',url,'STATUS',r.status,'CONTENT_TYPE',r.headers.get('Content-Type'),'FINAL_URL',r.url,'SAMPLE',repr(text[:100]))
            except Exception as error:
              print('PROBE_FAILURE',url,type(error).__name__,str(error)[:240])
          import re
          with urllib.request.urlopen(urllib.request.Request('https://sdas.space/SDFM/',headers={'User-Agent':'Mozilla/5.0'}),timeout=20) as r:
            html=r.read().decode('utf-8','replace')
          stale_tag=bool(re.search(r"""<script[^>]*src=["'][^"']*fleet-cloud-inline\\.js["']""",html,re.I))
          print('SDFM_LIVE_HTML_CHECK','correct_title',('Some Dudes and a Fleet Manager' in html),
            'obsolete_external_script',stale_tag,'bytes',len(html))
          PY
  cloudflare-production-alias-audit:
    name: Read-only Cloudflare Pages alias audit
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Inspect current production deployment and aliases
        run: |
          python3 - <<'PY'
          import os,urllib.request,json
          base='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CF_ACCOUNT_ID']+'/pages/projects/sdas-sc-website'
          head={'Authorization':'Bearer '+os.environ['CF_API_TOKEN']}
          for url in [base,base+'/deployments?env=production&per_page=6']:
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers=head),timeout=15) as r:
                raw=json.load(r)
              if not raw.get('success'):print('CLOUDFLARE_AUDIT_ERROR',raw.get('errors'));continue
              data=raw.get('result')
              if isinstance(data,list):
                for d in data:
                  print('CLOUDFLARE_DEPLOYMENT',json.dumps({k:d.get(k) for k in
                    ['id','url','environment','created_on','modified_on','aliases','latest_stage','deployment_trigger']},default=str)[:1700])
              else:
                print('CLOUDFLARE_PROJECT',json.dumps({
                  'name':data.get('name'),'subdomain':data.get('subdomain'),
                  'production_branch':data.get('production_branch'),
                  'build_config':{k:(data.get('build_config') or {}).get(k) for k in ['build_command','destination_dir','root_dir','build_caching']},
                  'git_auto_production':(data.get('source') or {}).get('config',{}).get('production_deployments_enabled'),
                  'domains':data.get('domains'),
                  'latest_deployment':{k:(data.get('latest_deployment') or {}).get(k)
                    for k in ['id','url','environment','created_on','aliases','deployment_trigger']},
                  'canonical_deployment':{k:(data.get('canonical_deployment') or {}).get(k)
                    for k in ['id','url','environment','created_on','aliases','deployment_trigger']},
                },default=str)[:3200])
            except Exception as e:print('CLOUDFLARE_AUDIT_FAILED',str(e)[:240])
          PY
  preview:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/preview/fleet-terminal-v2') || (github.event_name == 'push' && github.ref == 'refs/heads/preview/fleet-terminal-v2') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'preview/fleet-terminal-v2')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Stage Fleet Terminal and Discord login test
        run: |
          test -s fleet-preview/index.html
          test -s fleet-preview/auth-preview.js
          mkdir -p dist
          cp fleet-preview/index.html dist/index.html
          cp fleet-preview/auth-preview.js dist/auth-preview.js
          cp fleet-preview/fleet-design.css dist/fleet-design.css
          mkdir -p dist/public/images
          cp public/images/preview-hangar.png dist/public/images/preview-hangar.png
          test -s fleet-preview/fleet-cloud-inline.js
          test -s fleet-preview/rsi-import.js
          cp fleet-preview/rsi-import.js dist/rsi-import.js
          cp fleet-preview/fleet-ui-polish.js dist/fleet-ui-polish.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dist/index.html')
          s=p.read_text()
          assert '</body>' in s
          bridge=Path('fleet-preview/fleet-cloud-inline.js').read_text()
          if 'function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}' not in s:
            print('NOTICE: legacy save hook not matched; preserving current save function')
          s=s.replace('function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}', 'function save(){try{localStorage.setItem(KEY,JSON.stringify(db));window.sdasCloudQueueSave?.();return true}',1)
          if "const uid=()=> 'ship_'+Date.now()" not in s:
            print('NOTICE: legacy ID generator not matched; preserving current generator')
          s=s.replace("const uid=()=> 'ship_'+Date.now()", "const uid=()=> window.sdasCloudActive?crypto.randomUUID():'ship_'+Date.now()",1)
          # Preserve the existing application templates verbatim. The previous
          # string substitutions were too brittle and could corrupt the Data view.
          assert 'BACKUP / RESTORE' in s, 'Data / Import view missing from source'
          assert 'PLEDGED SHIP CSV IMPORT' in s, 'CSV import controls missing from source'
          print('Data / Import source templates present; retaining original app rendering')
          # Older inline preview code reparents panels and removes #app on Data / Import.
          # Remove that obsolete importer-layout controller; the new stylesheet handles layout.
          legacy_begin=s.find('// Keep the approved import page three-column layout separate from login and data handlers.')
          legacy_end=s.find('// Golden-ratio visual redesign: purely presentational, preserving legacy fleet handlers.',legacy_begin)
          assert legacy_begin>=0 and legacy_end>legacy_begin, 'Legacy destructive import controller not found; inspect before deploy'
          s=s[:legacy_begin]+s[legacy_end:]
          assert 'if(p&&p!==document.body' not in s, 'Unsafe panel removal logic remains in staged HTML'
          print('Removed obsolete inline Data / Import controller, keeping live importer and tab handlers')
          # fleet-preview/index.html still embeds an obsolete 2026-era cloud bridge.
          # The current bridge is appended below from fleet-cloud-inline.js. Running both
          # produces duplicate listeners and the old nickname/photo overview after refresh.
          import re
          cloud_marker='/* Cloud bridge: inserted into the legacy script for access to its existing UI functions. */'
          legacy_start=s.find(cloud_marker)
          assert legacy_start>=0, 'Expected original cloud bridge missing; inspect build before deployment'
          legacy_end_token='.catch(e=>status("Connection module unavailable: "+e.message));'
          legacy_ending=s.find(legacy_end_token,legacy_start)
          assert legacy_ending>=0, 'Original cloud bridge terminator missing'
          bridge_close=s.find('})()',legacy_ending+len(legacy_end_token))
          assert 0<=bridge_close-(legacy_ending+len(legacy_end_token))<20, 'Unexpected cloud bridge end'
          legacy_end=bridge_close+len('})()')
          assert legacy_end-legacy_start < 27000, 'Bridge removal span unexpected; refusing to rewrite'
          assert 's.nickname||s.name' in s[legacy_start:legacy_end], 'Wrong bridge selected'
          s=s[:legacy_start]+s[legacy_end:]
          print('Eliminated obsolete embedded cloud bridge, including nickname/photo dashboard')
          # Branding for the isolated Fleet Manager preview.
          s=s.replace('FLEET OPERATIONS TERMINAL','SOME DUDES FLEET MANAGER')
          s=s.replace('Fleet Operations Terminal','Some Dudes Fleet Manager')
          s=s.replace('<title>SDAS Fleet Terminal','<title>Some Dudes Fleet Manager')
          # Preserve the original site font for small controls and copy.
          # Large titles use the NASA-inspired display face with a readable fallback.
          font_css='''<style id="sdas-nasa-heading-font">
          @font-face{font-family:SDASNASA;src:local("Nasalization"),local("Nasalization Rg"),local("Eurostile Extended");font-display:swap}
          .sdas-large-heading{font-family:SDASNASA,"Arial Black",sans-serif!important;letter-spacing:.085em!important;text-transform:uppercase}
          </style>'''
          s=s.replace('</head>',font_css+'<link rel="stylesheet" href="/fleet-design.css"></head>',1)
          s=s.replace('</head>', '<script defer src="/fleet-ui-polish.js"></script></head>', 1)
          nasa_script='''<script>
          (()=>{const tag=()=>{document.querySelectorAll("h1,h2,h3,h4,h5,h6,.title,.brand").forEach(el=>{const n=parseFloat(getComputedStyle(el).fontSize)||0;if(n>20)el.classList.add("sdas-large-heading");else el.classList.remove("sdas-large-heading")})};new MutationObserver(()=>requestAnimationFrame(tag)).observe(document.body,{childList:true,subtree:true});tag()})();
          </script>'''
          s=s.replace('</body>',nasa_script+'</body>',1)
          assert '</script></body>' in s
          s=s.replace('</script></body>', '\n'+bridge+'\n</script><script defer src="/rsi-import.js"></script><script type="module" src="/auth-preview.js"></script></body>',1)
          # Diagnostic: inspect only short code fragments around relevant app selectors.
          for needle in ['const app=', 'id="app"', 'id="view"', 'id="viewRoot"', 'function dataPage(', 'function navTo(', 'function render(', 'BACKUP / RESTORE', 'PLEDGED SHIP CSV IMPORT']:
            index=s.find(needle)
            print('DIAG_SELECTOR',needle,'index',index)
            if index>=0:
              print('DIAG_EXCERPT',s[max(0,index-350):min(len(s),index+1800)].replace('\\n',' ')[:2150])
          for needle in ["demoHeadings","if(p&&p!==document.body","p.remove()","sdas-data-import-layout","sdas-golden-live-css","cloudBanner","sdas-golden-ratio-redesign"]:
            print("DIAG_LEGACY",needle,"count",s.count(needle))
          import re
          for needle in ['const legacy=clone(db)', 'sdas-golden-live-css', 's.nickname||s.name', 's.image&&', 'function draw()', 'window.sdasGoldenRefresh=refresh', '__sdasFleetCloudBridgeInstalled']:
            hits=[m.start() for m in re.finditer(re.escape(needle),s)]
            print("LEGACY_CHECK",needle,"HITS",hits)
            for index in hits[:4]: print("LEGACY_CONTEXT",needle,"AT",index,repr(s[max(0,index-400):min(len(s),index+400)]))
          assert s.count(cloud_marker)==1, 'Cloud bridge included more than once'
          assert 's.nickname||s.name||"Unnamed ship"' not in s, 'Legacy nickname-first dashboard still present'
          assert s.count('const legacy=clone(db)')==1, 'Duplicate Supabase bridge detected'
          p.write_text(s)
          PY
      - name: Validate deployed JavaScript syntax
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
            def __init__(self): super().__init__(); self.scripts=[]; self.active=False; self.text=""
            def handle_starttag(self,tag,attrs):
              if tag=='script':
                self.active=not dict(attrs).get('src'); self.text=""
            def handle_data(self,data):
              if self.active: self.text+=data
            def handle_endtag(self,tag):
              if tag=='script' and self.active:
                self.scripts.append(self.text); self.active=False
          p=Scripts(); p.feed(Path("dist/index.html").read_text())
          for i,script in enumerate(p.scripts):
            if script.strip(): Path(f"/tmp/fleet-script-{i}.js").write_text(script)
          print("Found",len(p.scripts),"inline scripts")
          PY
          for file in /tmp/fleet-script-*.js; do node --check "$file"; done
          node --check dist/auth-preview.js
          node --check dist/rsi-import.js
          node --check dist/fleet-ui-polish.js
      - name: Browser navigation smoke test
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --directory dist >/tmp/fleet-preview-http.log 2>&1 &
          node fleet-preview/navigation-smoke.mjs
      - name: Deploy non-production Fleet Terminal review
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=sdas-sc-website --branch=fleet-terminal-review
