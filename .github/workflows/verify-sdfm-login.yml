name: Verify SDFM login card
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/stage-sdfm.py'
      - 'scripts/sdfm-production-login.js'
      - '.github/workflows/verify-sdfm-login.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Validate both sign-in entry points
        run: |
          python3 scripts/stage-sdfm.py
          node --check dist/SDFM/auth-preview.js
          node --check dist/SDFM/sdfm-production-login.js
          python3 - <<'PY'
          from pathlib import Path
          html=Path('dist/SDFM/index.html').read_text()
          auth=Path('dist/SDFM/auth-preview.js').read_text()
          cloud=html
          assert 'sdfm-production-login.js' in html
          login=Path('dist/SDFM/sdfm-production-login.js').read_text()
          assert 'sdasFleetAuthStorage' in login
          assert 'sdasFleetSharedClientPromise' in login
          assert 'sdasFleetSharedClientPromise' in auth and 'sdasFleetSharedClientPromise' in cloud
          assert 'sdasFleetStartDiscordLogin' in auth
          assert 'sdasFleetRetryCloudLoad' in cloud
          assert 'sdas-cloud-status' in cloud
          assert 'Retry Fleet Connection' in login
          assert 'sdfm-production-login.js?v=20261020-cloud-handoff' in html
          assert 'RECONNECT DISCORD' in auth
          assert 'auth-preview.js?v=20261020-cloud-handoff' in html
          assert 'Cache-Control: no-cache' in Path('dist/_headers').read_text()
          assert 'sdas-live-signin-card' in Path('dist/SDFM/sdfm-production-login.js').read_text()
          assert 'sdas-production-access' in html
          assert '<div id="root">' in Path('dist/index.html').read_text()
          assert Path('dist/sdfm/index.html').exists()
          print('Live login and session preference packaging verified')
          PY
